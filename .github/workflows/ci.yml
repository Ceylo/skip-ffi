name: skip-ffi
on:
  push:
    branches: [ main, ci/arm-macos-runners-run ]
    tags: "[0-9]+.[0-9]+.[0-9]+"
  schedule:
    - cron:  '0 10 * * *'
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  call-workflow:
    uses: Ceylo/actions/.github/workflows/skip-framework.yml@fix/arm64-emulator-guard
    with:
      runs-on: "['macos-26', 'ubuntu-24.04']"
